<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sample Docs</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; color: #222; }
    h1 { font-size: 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .card img { width: 100%; height: 180px; object-fit: contain; background: #eee; border-radius: 6px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .btn { background: #2563eb; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; border: 0; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    #all { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Images</h1>
  <button id="all" class="btn">Download All</button>
  <div class="grid" id="grid"></div>
  <script>
    const images = ["sample-1.jpg","sample-2.jpg","sample-3.jpg","sample-4.jpg","sample-5.jpg"];
    const grid = document.getElementById("grid");
    images.forEach((file, i) => {
      grid.insertAdjacentHTML("beforeend", `
        <div class="card">
          <img src="${file}" alt="Image ${i + 1}">
          <div class="row">
            <span>Image ${i + 1}</span>
            <a class="btn" href="${file}" download="${file}">Download</a>
          </div>
        </div>`);
    });
    document.getElementById("all").addEventListener("click", () => {
      document.querySelectorAll(".card .btn").forEach((a, i) => setTimeout(() => a.click(), i * 300));
    });
  </script>
</body>
</html>
